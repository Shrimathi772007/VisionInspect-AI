server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single uploads are limited to MAX_UPLOAD_SIZE_MB (10) by the API; a batch can be up to 50 MB.
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API: /api/inspections -> http://backend:8000/inspections (the trailing slash strips the prefix).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-sent X-Forwarded-For is discarded, so the backend sees the real peer
        # address (the login rate limit is keyed on it). A proxy in front of this one needs real_ip handling.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        # Inference is synchronous (Grid ~2 s per image) and requests can queue behind each other.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change for a given name.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: deep links such as /inspections are served index.html and routed client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
